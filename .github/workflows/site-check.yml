name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website and assets
        run: | 
          node scripts/check-site.mjs
          node aegis/aegis.mjs
          node aegis/trustprint.mjs verify
          node scripts/check-mirror.mjs
          node scripts/test-integrity-studio.mjs
          node scripts/check-filecheck.mjs
          node scripts/filecheck-functional-test.cjs